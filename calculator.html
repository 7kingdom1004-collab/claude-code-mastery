<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-lg shadow-lg p-6 w-80">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">계산기</h1>

        <!-- 디스플레이 -->
        <div class="bg-gray-900 text-white rounded-lg mb-4">
            <div class="text-gray-400 text-sm p-2 px-4 min-h-6" id="previousOperand"></div>
            <div class="text-right p-4 text-3xl font-mono overflow-hidden break-words min-h-12" id="display">0</div>
        </div>

        <!-- 버튼 그리드 -->
        <div class="grid grid-cols-4 gap-2">
            <!-- 첫 번째 줄 -->
            <button class="operator-btn col-span-2 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg" data-operator="clear">
                AC
            </button>
            <button class="operator-btn bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg" data-operator="/">
                ÷
            </button>
            <button class="operator-btn bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg" data-operator="*">
                ×
            </button>

            <!-- 두 번째 줄 -->
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="7">
                7
            </button>
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="8">
                8
            </button>
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="9">
                9
            </button>
            <button class="operator-btn bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg" data-operator="-">
                −
            </button>

            <!-- 세 번째 줄 -->
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="4">
                4
            </button>
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="5">
                5
            </button>
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="6">
                6
            </button>
            <button class="operator-btn bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg" data-operator="+">
                +
            </button>

            <!-- 네 번째 줄 -->
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="1">
                1
            </button>
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="2">
                2
            </button>
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="3">
                3
            </button>
            <button class="operator-btn bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-lg" data-operator="delete">
                DEL
            </button>

            <!-- 다섯 번째 줄 -->
            <button class="number-btn col-span-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number="0">
                0
            </button>
            <button class="number-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg" data-number=".">
                .
            </button>
            <button class="operator-btn bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg" data-operator="=">
                =
            </button>
        </div>
    </div>

    <script>
        // 계산기 클래스 - 상태와 메서드를 하나의 단위로 캡슐화
        class Calculator {
            constructor(previousOperandElement, currentOperandElement) {
                this.previousOperandElement = previousOperandElement;
                this.currentOperandElement = currentOperandElement;
                this.clear();
            }

            // 초기화 - 모든 상태 리셋
            clear() {
                this.currentOperand = '';        // 현재 입력값
                this.previousOperand = '';       // 연산 대기 중인 값
                this.operation = undefined;      // 선택된 연산자
                this.updateDisplay();
            }

            // 삭제 - 마지막 자리 제거
            delete() {
                this.currentOperand = this.currentOperand.toString().slice(0, -1);
                this.updateDisplay();
            }

            // 숫자 추가 - 입력값에 숫자나 소수점 붙이기
            appendNumber(number) {
                // 소수점 중복 검사 - 이미 소수점이 있으면 무시
                if (number === '.' && this.currentOperand.includes('.')) return;

                this.currentOperand = this.currentOperand.toString() + number.toString();
                this.updateDisplay();
            }

            // 연산자 선택 - 연산을 예약하고 이전 값 저장
            chooseOperation(operation) {
                // 현재 입력이 없으면 연산 불가
                if (this.currentOperand === '') return;

                // 이미 연산 대기 중이면 먼저 계산 수행 (연속 연산 지원)
                if (this.previousOperand !== '') {
                    this.compute();
                }

                // 현재값을 이전값으로 이동, 새 연산자 설정
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '';
                this.updateDisplay();
            }

            // 계산 수행 - switch문으로 각 연산자별 계산
            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);

                // 유효한 숫자가 없으면 계산하지 않음
                if (isNaN(prev) || isNaN(current)) return;

                // 연산자별로 계산 수행
                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '*':
                        computation = prev * current;
                        break;
                    case '/':
                        // 0으로 나누기 방지
                        if (current === 0) {
                            alert('0으로 나눌 수 없습니다!');
                            this.clear();
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }

                // 계산 결과를 현재값으로 설정, 연산 상태 초기화
                this.currentOperand = computation.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.updateDisplay();
            }

            // 숫자를 천 단위로 포맷팅 (가독성 개선)
            formatNumber(number) {
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];

                let integerDisplay;

                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    // toLocaleString() - 지역화된 숫자 포맷
                    integerDisplay = integerDigits.toLocaleString('en', {
                        maximumFractionDigits: 0
                    });
                }

                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            // 디스플레이 업데이트 - UI에 현재 상태 반영
            updateDisplay() {
                this.currentOperandElement.innerText =
                    this.formatNumber(this.currentOperand) || '0';

                // 연산 대기 중이면 이전 값과 연산자 표시
                if (this.operation != null) {
                    this.previousOperandElement.innerText =
                        `${this.formatNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandElement.innerText = '';
                }
            }
        }

        // 계산기 인스턴스 생성
        const previousOperandElement = document.getElementById('previousOperand');
        const currentOperandElement = document.getElementById('display');
        const calculator = new Calculator(previousOperandElement, currentOperandElement);

        // 숫자 버튼 이벤트 - 이벤트 위임 패턴 사용
        document.querySelectorAll('.number-btn').forEach(button => {
            button.addEventListener('click', () => {
                calculator.appendNumber(button.dataset.number);
            });
        });

        // 연산자 버튼 이벤트
        document.querySelectorAll('.operator-btn').forEach(button => {
            button.addEventListener('click', () => {
                const operator = button.dataset.operator;

                switch (operator) {
                    case 'clear':
                        calculator.clear();
                        break;
                    case 'delete':
                        calculator.delete();
                        break;
                    case '=':
                        calculator.compute();
                        break;
                    default:
                        calculator.chooseOperation(operator);
                }
            });
        });

        // 키보드 지원 - 접근성 및 사용성 개선
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') calculator.appendNumber(e.key);
            if (e.key === '.') calculator.appendNumber('.');
            if (e.key === '+' || e.key === '-') calculator.chooseOperation(e.key);
            if (e.key === '*') { e.preventDefault(); calculator.chooseOperation('*'); }
            if (e.key === '/') { e.preventDefault(); calculator.chooseOperation('/'); }
            if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculator.compute(); }
            if (e.key === 'Backspace') calculator.delete();
            if (e.key === 'Escape') calculator.clear();
        });
    </script>
</body>
</html>
